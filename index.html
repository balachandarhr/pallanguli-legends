<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0f08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="PALLANGULI LEGENDS: the traditional Tamil seed-and-pit game (பல்லாங்குழி) in your browser. Play the computer or a friend.">
<title>PALLANGULI LEGENDS · பல்லாங்குழி</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="assets/logo.png" as="image">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- BALA HR start-up splash (self-contained; tap or any key skips) -->
<style>
#bhSplash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vmin;background:radial-gradient(ellipse at center,#1d2a4a 0%,#0a0f1f 55%,#05070d 100%);opacity:1;transition:opacity .6s ease;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#bhSplash.out{opacity:0;pointer-events:none}
#bhSplash img{display:block;max-width:70vw;max-height:70vh;max-height:70dvh;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 0 3vmin rgba(255,170,40,.35));opacity:0;transform:scale(.86);transition:opacity .7s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
#bhSplash.in img{opacity:1;transform:scale(1)}
#bhSplash p{margin:0;font:600 clamp(11px,2.4vmin,16px)/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#c9d3ea;opacity:0;transition:opacity .8s ease .4s}
#bhSplash.in p{opacity:.8}
@media (prefers-reduced-motion:reduce){#bhSplash img{transform:none;transition:opacity .3s}}
</style>
<div id="bhSplash" role="img" aria-label="Presented by BALA HR (@popkalis). Tap to skip."><img id="bhSplashImg" src="assets/logo.png" alt="BALA HR @popkalis logo" width="560" height="542" decoding="async"><p>Presented by BALA HR</p></div>
<script>
(function(){
  var s=document.getElementById('bhSplash'),img=document.getElementById('bhSplashImg'),done=false,shown=false,t1,t2;
  if(!s)return;
  function end(fast){
    if(done)return;done=true;clearTimeout(t1);clearTimeout(t2);
    s.classList.add('out');
    setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);window.dispatchEvent(new Event('bhsplashdone'));},fast?150:650);
    document.removeEventListener('keydown',onKey,true);
  }
  function onKey(e){if(e.key==="Tab")return;e.preventDefault();e.stopPropagation();end();}
  function show(){
    if(shown||done)return;shown=true;
    requestAnimationFrame(function(){s.classList.add('in');});
    t1=setTimeout(end,2500);
  }
  // click (not pointerdown) so the tap is consumed by the splash and does not hit menu buttons underneath
  s.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();end();});
  document.addEventListener('keydown',onKey,true);
  img.addEventListener('error',function(){end(true);});
  if(img.complete&&img.naturalWidth)show();else img.addEventListener('load',show);
  t2=setTimeout(function(){if(!shown)end(true);},2000); // image too slow: skip
  window.__bhSplash={end:end};
})();
</script>
<div id="app">
  <header id="topbar">
    <button id="tbBack" class="icon" aria-label="Back" hidden>‹</button>
    <div id="tbTitle"></div>
    <button id="tbCoins" class="pill" aria-label="Coins"><span class="coin"></span><b id="coinAmt">0</b></button>
    <button id="tbLang" class="pill" aria-label="Language">தமிழ்</button>
    <button id="tbSound" class="icon" aria-label="Sound">🔊</button>
  </header>
  <main id="view"></main>
  <section id="game" hidden>
    <div id="gHud">
      <div class="pl" id="plB"><span class="dot"></span><span class="nm"></span><span class="sc"><small></small><b>0</b></span></div>
      <div id="gMid"><div id="gRound"></div><div id="gTimer" hidden><i></i><span></span></div></div>
      <div class="pl" id="plA"><span class="dot"></span><span class="nm"></span><span class="sc"><small></small><b>0</b></span></div>
    </div>
    <div id="boardWrap"><canvas id="board" aria-label="Pallanguli board"></canvas></div>
    <div id="gInfo" aria-live="polite"><div id="gStatus"></div><div id="gExplain"></div></div>
    <div id="gActions">
      <button id="aHint" class="btn sm">💡 <span></span></button>
      <button id="aUndo" class="btn sm">↶ <span></span></button>
      <button id="aSpeed" class="btn sm">⏩ <span></span></button>
      <button id="aSkip" class="btn sm">⏭ <span></span></button>
    </div>
  </section>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal" hidden><div class="card" id="modalCard"></div></div>
</div>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/i18n.js"></script>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
